services:
  # Backend Service
  - type: web
    name: ruralreach-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run dev
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # Frontend Service
  - type: static
    name: ruralreach-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ruralreach-backend
          type: web
          property: host
    routes:
      - type: rewrite
        src: /*
        dest: /index.html
